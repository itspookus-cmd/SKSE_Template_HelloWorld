; =========================================================
;  Chest Glow settings
;  Edit with Notepad. Changes apply the next time you start
;  the game. Lines starting with ; are notes and are ignored.
; =========================================================

[Rarity]
; A weapon worth this much gold or more counts as LEGENDARY (yellow glow).
LegendaryMinValue = 2000

; Daedric artifacts (Mehrunes' Razor, Dawnbreaker, etc.) always count as Legendary.
ArtifactsAreLegendary = true

; A weapon worth this much gold or more counts as EPIC (purple glow).
EpicMinValue = 500

; If true, an Epic weapon must also be enchanted.
EpicMustBeEnchanted = true

[Glow]
; Colors as Red, Green, Blue (each 0 to 255).
LegendaryColor = 255, 200, 0
EpicColor = 170, 60, 255

; How bright the glow is, from 0.0 (faint) to 1.0 (strong).
GlowStrength = 1.0

; How fast the glow gently pulses. 0 = steady glow.
PulseSpeed = 1.0

[Debug]
; If true, the ~ console prints a line each time a chest starts glowing.
ShowConsoleMessages = false
