; =========================================================
;  Chest Glow settings
;  Edit with Notepad, or in-game with SKSE Menu Framework.
;  Lines starting with ; are notes and are ignored.
; =========================================================

[General]
; Turn the whole mod on or off.
Enabled = true

; Each tier is a gold range: From and To are both included.
; If ranges overlap, the better tier wins (so 1000 gold is Legendary,
; and 100 gold is Epic). A chest glows in the color of the best tier
; inside it. Colors are Red, Green, Blue (each 0 to 255).
; MustBeEnchanted = true means only enchanted weapons can be in that tier.
; Weapons outside every range don't make a chest glow.

[Legendary]
LegendaryEnabled = true
LegendaryFrom = 1000
LegendaryTo = 10000
LegendaryMustBeEnchanted = false
LegendaryColor = 255, 200, 0

[Epic]
EpicEnabled = true
EpicFrom = 100
EpicTo = 1000
EpicMustBeEnchanted = false
EpicColor = 170, 60, 255

[Common]
CommonEnabled = true
CommonFrom = 0
CommonTo = 100
CommonMustBeEnchanted = false
CommonColor = 60, 220, 80

[Rules]
; Daedric artifacts always count as Legendary, whatever their value.
ArtifactsAreLegendary = true

[Glow]
; Seam = light shines from the chest's lid seam. Whole = the whole chest glows.
GlowStyle = Seam

; Seam light: how far it reaches (about 70 = 1 meter) and how bright it is.
LightRadius = 200
LightBrightness = 1.5

; Where the seam is, as a share of the chest's height (0 = bottom, 1 = top).
SeamHeight = 0.6

; Whole-chest glow: how bright it is, from 0.0 (faint) to 1.0 (strong).
GlowStrength = 1.0

; How fast the glow gently pulses. 0 = steady glow.
PulseSpeed = 1.0

; Leave empty to let the mod pick a texture automatically.
; To try a different look, copy one of the texture names listed in
; ChestGlow.log and paste it here, for example:
;   GlowTexture = Effects\SomeTexture.dds
GlowTexture =

[Debug]
; If true, the ~ console prints a line each time a chest starts glowing.
ShowConsoleMessages = false

; If true, ChestGlow.log records every chest check (for troubleshooting).
; Turned on for testing; set to false once everything works.
DetailedLog = true

[Performance]
; How far around you the mod looks for containers (Skyrim units; about 70 = 1 meter).
ScanRadius = 3000

; Seconds between looks.
ScanInterval = 2
