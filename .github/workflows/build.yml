name: Build plugin

# Runs every time you save (commit) a change, and you can also start it by hand
on:
  push:
  workflow_dispatch:

# If you commit again while a build is running, cancel the old build
# and only build the newest version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Older Windows image with Visual Studio 2022, which matches this template
    runs-on: windows-2022
    env:
      # Lets older libraries build even if the machine has a very new CMake
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Where the pre-built libraries are kept between builds (see the cache step)
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Make the library cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # Reuses the libraries built last time instead of building them again.
      # The first build after this change is still slow; later ones are much faster.
      - name: Restore the library cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install the Ninja build tool
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Turn on the Microsoft C++ compiler
        uses: ilammy/msvc-dev-cmd@v1

      # This must come AFTER the compiler step, which otherwise overwrites it
      - name: Point the build at the vcpkg that GitHub already installed
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release

      - name: Package the mod (ready to install with a mod manager)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/SKSE/Plugins | Out-Null
          Copy-Item build/release/*.dll package/SKSE/Plugins/
          if (Test-Path ChestGlow.ini) { Copy-Item ChestGlow.ini package/SKSE/Plugins/ }

      - name: Save the finished mod so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: ChestGlow-mod
          path: package/

      - name: On failure, save the detailed logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            build/release/vcpkg-manifest-install.log
            build/release/vcpkg_installed/vcpkg/blds/**/*.log
