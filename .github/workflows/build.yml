name: Build plugin

# Runs every time you save (commit) a change, and you can also start it by hand
on:
  push:
  workflow_dispatch:

# If you commit again while a build is running, cancel the old build
# and only build the newest version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Older Windows image with Visual Studio 2022, which matches this template
    runs-on: windows-2022
    env:
      # Lets older libraries build even if the machine has a very new CMake
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      # Where the pre-built libraries are kept between builds (see the cache step)
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      # A fixed vcpkg version. GitHub's machines each come with their own vcpkg, and a
      # different vcpkg makes the saved libraries unusable, so we bring our own.
      VCPKG_VERSION: "2026.10.16"
    steps:
      - name: Get your code
        uses: actions/checkout@v4

      - name: Make the library cache folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      # Reuses the libraries built last time instead of building them again.
      # A fresh copy is saved after every build, so one slow build fixes the next ones.
      - name: Restore the library cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ env.VCPKG_VERSION }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-
            vcpkg-${{ env.VCPKG_VERSION }}-

      - name: Get our fixed vcpkg version
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch $env:VCPKG_VERSION https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\..\vcpkg"
          & "$env:GITHUB_WORKSPACE\..\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install the Ninja build tool
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Turn on the Microsoft C++ compiler
        uses: ilammy/msvc-dev-cmd@v1

      # This must come AFTER the compiler step, which otherwise overwrites it
      - name: Point the build at our vcpkg
        shell: pwsh
        run: |
          "VCPKG_ROOT=$((Resolve-Path "$env:GITHUB_WORKSPACE\..\vcpkg").Path)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release

      - name: Package the mod (ready to install with a mod manager)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/SKSE/Plugins | Out-Null
          Copy-Item build/release/*.dll package/SKSE/Plugins/
          if (Test-Path ChestGlow.ini) { Copy-Item ChestGlow.ini package/SKSE/Plugins/ }
          # Glow models and textures, if they've been added to the repo in an 'assets' folder
          if (Test-Path assets) { Copy-Item assets/* package/ -Recurse -Force }

      - name: Save the finished mod so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: ChestGlow-mod
          path: package/

      - name: On failure, save the detailed logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            build/release/vcpkg-manifest-install.log
            build/release/vcpkg_installed/vcpkg/blds/**/*.log
